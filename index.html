<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>무주덕유산 CCTV 모아보기</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#f5f5f5}
*{box-sizing:border-box}body{margin:0;padding:24px}header{max-width:1500px;margin:0 auto 20px}h1{font-size:24px;margin:0 0 8px}p{color:#bbb;margin:0;line-height:1.55}.grid{max-width:1500px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}.card{background:#202020;border:1px solid #333;border-radius:10px;overflow:hidden}.card h2{font-size:16px;margin:0;padding:12px 14px}.screen{aspect-ratio:16/9;background:#050505}.screen iframe{width:100%;height:100%;border:0}.actions{padding:9px 14px 13px}.actions a{color:#8fc8ff;text-decoration:none;font-size:14px}.actions a:hover{text-decoration:underline}.note{max-width:1500px;margin:18px auto 0;font-size:13px}
</style>
</head>
<body>
<header><h1>무주덕유산 CCTV 모아보기</h1><p>카메라 화면을 동시에 불러옵니다. 페이지 전체가 1분마다 자동으로 새로고침됩니다. 화면이 나오지 않으면 카드 아래의 ‘원본 열기’를 누르세요.</p></header>
<main class="grid" id="grid"></main>
<p class="note">리조트 웹캠은 이용 시간이 1분으로 안내되어 있으며, 영상은 리조트 사정으로 제공되지 않을 수 있습니다.</p>
<script>
const cameras=[
 ['설천봉 정상','07'],['설천상단슬로프','06'],['모차르트·미뉴에트','08'],
 ['만선봉 정상','02'],['하이디 하우스','03'],['서역기행·썬다운','04'],
 ['설천하우스','05'],['만선하우스','01'],['폴카','09'],['실크로드','10'],['커넥션','11']
];
const root='https://www.mdysresort.com/guide/webcam_popup_jh.asp?cam_num=';
document.getElementById('grid').innerHTML=cameras.map(([name,id])=>{const url=root+id;return `<section class="card"><h2>${name}</h2><div class="screen"><iframe src="${url}" title="${name}" allow="autoplay; fullscreen" loading="lazy"></iframe></div><div class="actions"><a href="${url}" target="_blank" rel="noopener">원본 열기 ↗</a></div></section>`}).join('');
</script>
</body>
</html>
