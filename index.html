<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무주 CCTV">
<title>무주 CCTV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root { --bg:#0e0f11; --tile:#17191c; --line:#2a2d32; --text:#e8e9eb; --muted:#8a8f97; --accent:#f2b705; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  body { padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width:1100px; margin:0 auto; padding:12px 16px 24px; }
  header { display:flex; align-items:baseline; gap:10px; margin:4px 0 12px; }
  header h1 { font-size:18px; margin:0; }
  header .meta { margin-left:auto; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .live { background:var(--tile); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .live .bar, .sec { display:flex; align-items:center; gap:8px; font-size:14px; }
  .live .bar { padding:8px 12px; border-bottom:1px solid var(--line); }
  .live .bar .src, .card .src { color:var(--muted); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#e5484d; box-shadow:0 0 0 3px rgba(229,72,77,.2); }
  .live .bar button { margin-left:auto; background:none; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:4px 10px; font-size:12px; }
  .vbox { position:relative; aspect-ratio:16/9; background:#000; }
  .vbox video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .vbox .msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .sec { margin:20px 0 10px; color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .card { display:flex; flex-direction:column; gap:4px; padding:14px 12px; min-height:78px; text-decoration:none; color:var(--text);
    background:var(--tile); border:1px solid var(--line); border-radius:10px; }
  .card:active { border-color:var(--accent); }
  .card b { font-size:15px; font-weight:600; }
  .card .go { margin-top:auto; font-size:12px; color:var(--accent); }
  .note { color:var(--muted); font-size:12px; line-height:1.6; margin-top:14px; }
  .map { display:block; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .map img { display:block; width:100%; height:auto; }
  @media (min-width:800px) { .grid { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>무주 CCTV</h1>
    <span class="meta">새로고침 <span id="count">60</span>초</span>
  </header>

  <div class="live">
    <div class="bar"><span class="dot"></span><b>설천봉 정상</b><span class="src">국립공원 · 실시간</span>
      <button id="now">새로고침</button></div>
    <div class="vbox"><video id="v" muted autoplay playsinline></video><div class="msg" id="msg">영상 불러오는 중…</div></div>
  </div>

  <div class="sec">리조트 웹캠 · 누르면 바로 열림 (뒤로가기로 복귀)</div>
  <div class="grid" id="grid"></div>

  <p class="note">리조트 웹캠은 보안 연결(https)을 지원하지 않아서 이 페이지 안에 같이 띄울 수는 없어서, 누르면 그 웹캠 화면으로 넘어가. 뒤로가기 하면 여기로 돌아와.
    리조트 웹캠은 30초 재생 후 멈추니까, 멈추면 그 창을 새로고침하면 돼.</p>

  <div class="sec">웹캠 위치 · 누르면 크게 보기</div>
  <a class="map" href="map.jpg" target="_blank" rel="noopener"><img src="map.jpg" alt="무주 리조트 웹캠 위치 지도" loading="lazy"></a>
</div>

<script>
const KNPS = "https://live.knps.or.kr/cctv/hls/zsulchun.m3u8";
const R = "http://www.mdysresort.com/guide/webcam_popup_jh.asp?cam_num=";
const RESORT = [
  ["설천봉 정상", "리조트", "07"],
  ["설천하우스", "곤돌라 타는 곳", "05"],
  ["커넥션", "설천하우스 옆 쌍쌍리프트", "11"],
  ["설천상단슬로프", "", "06"],
  ["실크로드", "", "10"],
  ["서역기행·썬다운", "10K 코스", "04"],
];
const grid = document.getElementById("grid");
RESORT.forEach(([name, src, n]) => {
  const a = document.createElement("a");
  a.className = "card"; a.href = R + n;
  a.innerHTML = "<b></b><span class='src'></span><span class='go'>보기 ↗</span>";
  a.querySelector("b").textContent = name;
  a.querySelector(".src").textContent = src;
  grid.appendChild(a);
});

const v = document.getElementById("v"), msg = document.getElementById("msg");
let hls = null;
function load() {
  msg.style.display = "none";
  if (window.Hls && Hls.isSupported()) {
    if (hls) hls.destroy();
    hls = new Hls({ liveSyncDurationCount: 2 });
    hls.loadSource(KNPS); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { msg.textContent = "영상 불러오기 실패 — 잠시 후 다시 시도"; msg.style.display = "flex"; } });
  } else if (v.canPlayType("application/vnd.apple.mpegurl")) {
    v.src = KNPS + "?_t=" + Date.now(); v.play().catch(() => {});
  }
}
load();

const REFRESH = 60; let left = REFRESH;
const countEl = document.getElementById("count");
function reload() { load(); left = REFRESH; countEl.textContent = left; }
document.getElementById("now").onclick = reload;
setInterval(() => { if (--left <= 0) reload(); countEl.textContent = left; }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) reload(); });
</script>
</body>
</html>
